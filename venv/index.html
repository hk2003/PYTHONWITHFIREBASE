<!DOCTYPE html>
<html>
<head>
    <title>Firebase Data Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        .table-container {
            width: 90%;
            margin: 20px auto;
            overflow-x: auto; /* Allows horizontal scrolling */
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap; /* Prevents text from wrapping */
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
            position: sticky;
            top: 0;
            z-index: 2;
        }
    </style>
    <script>
        async function fetchData() {
            try {
                let response = await fetch("http://127.0.0.1:8000/data");
                let result = await response.json();
                let data = result.data;

                let table = "<div class='table-container'><table><tr>";
                if (data.length > 0) {
                    Object.keys(data[0]).forEach(key => {
                        table += `<th>${key}</th>`;
                    });
                    table += "</tr>";

                    data.forEach(row => {
                        table += "<tr>";
                        Object.values(row).forEach(value => {
                            table += `<td>${value}</td>`;
                        });
                        table += "</tr>";
                    });

                    table += "</table></div>";
                } else {
                    table = "<p>No data available</p>";
                }

                document.getElementById("output").innerHTML = table;
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById("output").innerHTML = "<p>Error loading data. Check console for details.</p>";
            }
        }

        window.onload = fetchData;
    </script>
</head>
<body>
    <h2>Data from Firebase</h2>
    <div id="output"></div>
</body>
</html>
